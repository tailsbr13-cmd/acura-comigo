<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Acura Comigo</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

#top{background:linear-gradient(90deg,#16205a,#1b2a6b);padding:14px 20px;display:flex;align-items:center;gap:14px}

.nav{border-top:1px solid #2c3858;padding-top:8px;display:flex;flex-direction:column}

#main{flex:1;overflow:auto;padding:22px 26px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.head .g{flex:1}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input,.tools select{background:var(--field);border:1px solid #444;border-radius:8px;padding:6px 8px;color-scheme:dark}
.btn{background:var(--acc);padding:7px 14px;border-radius:8px;font-weight:600}.btn.g2{background:#3a3a3a}

.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}

.f:focus{border-color:var(--acc);outline:0}textarea.f{min-height:80px;resize:vertical}
.drop{margin-top:12px;border:1px dashed #666;border-radius:10px;padding:12px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--acc);background:#2f6bff18}.drop button{color:#4d8dff}
.th{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-start}

.th .x{position:absolute;top:3px;right:3px;background:#000b;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:11px}.th .x:hover{background:var(--bad)}
.acts{display:flex;gap:4px;margin-top:10px;justify-content:flex-end}.acts button{padding:5px 10px;border-radius:8px;color:var(--mut)}.acts button:hover{background:#222;color:#fff}.acts .on{color:#ffc933}.acts .del:hover{color:var(--bad)}
.new{display:block;width:100%;max-width:880px;border:1px dashed #666;border-radius:12px;padding:22px;color:var(--mut)}.new:hover{border-color:var(--acc);color:#fff}
.empty{color:var(--mut);padding:40px 0;max-width:520px;line-height:1.6}
dialog{background:#1b2338;color:var(--tx);border:1px solid #3a4768;border-radius:14px;padding:20px;width:420px}
dialog::backdrop{background:#000a}dialog .f{background:#2a3454}dialog .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:92vw;max-height:92vh;border-radius:8px}
#toast{position:fixed;bottom:18px;right:18px;background:#1b2338;border:1px solid #3a4768;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none}#toast.v{opacity:1}
@media(max-width:1000px){.row{grid-template-columns:1fr}}
.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge.u{color:#ffb020;background:#2e2410;opacity:1}
.acts .sv{color:#fff;margin-right:auto;padding:7px 16px}.acts .sv:hover{background:#4a7cff;color:#fff}

.pn{margin-top:12px;display:flex;flex-direction:column;gap:4px}.pn small{color:var(--mut)}

.card.sm{cursor:pointer}.card.sm:hover{outline:1px solid #3a4768}.pv{color:var(--mut);margin-top:4px}.card.sm .acts{margin-top:6px}
.cols{display:flex;gap:20px;align-items:flex-start}.left{flex:1;min-width:0;max-width:880px}.head{min-width:0}
.notes{width:430px;flex:none;max-width:none;margin:0;padding:0;position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 150px);overflow:hidden}

.xsm{font-size:12px}
.xw{max-width:880px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}

.tp{margin-bottom:10px}.tl{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;color:var(--tx)}.tl small{color:var(--mut);margin-left:auto}.ta{padding-left:24px}.tl input{accent-color:var(--acc)}
.sumbox{background:#0e1b2e;border:1px solid #1f3a63;border-radius:12px;padding:14px 16px;margin-bottom:12px}

.res{border-radius:10px;padding:12px 14px;margin-bottom:12px;max-width:880px}.res.ok{background:#0f2a18;border:1px solid #1d6b3a;color:#7ee2a2}.res.bad{background:#2e1414;border:1px solid #7a2a2a;color:#ff9a9a}.res small{display:block;word-break:break-all;color:var(--mut);margin:4px 0 8px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.btn:disabled{opacity:.4;cursor:not-allowed}.acts2 .btn{display:inline-flex;align-items:center}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--tx);font-size:13px}
.dz{border:2px dashed #4a5a8a;border-radius:14px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mut);max-width:880px}
.dz.over{border-color:var(--acc);background:#2f6bff18}.dz .si{width:40px;height:40px;margin:0;color:#8fb0ff}.dz b{color:var(--tx);font-size:16px}
#busy{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px;color:#fff}#busy.on{display:flex}
.spin{width:38px;height:38px;border:4px solid #ffffff33;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ibanner{background:linear-gradient(90deg,#2a1d5e,#1d2a5e);border:1px solid #5a47b8;border-left:5px solid #9b7bff;border-radius:12px;padding:12px 16px;margin-bottom:14px;max-width:980px;color:#d9ceff}
.ibanner small{display:block;color:#b3a6e6;margin-top:3px}.ibanner .si{color:#b79cff}
.tag{font-size:11px;background:#33285e;color:#c9b8ff;border-radius:99px;padding:2px 9px;font-weight:600}.tag.rel{background:#2e2410;color:#ffcf6a;font-weight:400;margin-left:6px}
.ph{margin:18px 0 8px;font-size:16px;color:#c9b8ff;display:flex;gap:10px;align-items:center}
.iart{margin-bottom:18px;max-width:980px;border-left:3px solid #7a5cff;padding-left:14px}.iah{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;font-size:15px}
.inote{background:#0e1b2e;border:1px solid #1f3a63;border-left:4px solid #3fa7ff;border-radius:12px;padding:12px 16px;margin-bottom:10px}.inote h4{margin:0 0 6px;color:#8cc8ff;font-size:14px}
.inote .ro,.icard .obs{white-space:pre-wrap;overflow-wrap:anywhere}.icard{border:1px solid #2b2350;max-width:none}
@media(max-width:1000px){.opts{grid-template-columns:1fr}}
.rcol{width:430px;flex:none;position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 150px);overflow:auto}

/* ---- Checkpoint Semanal ---- */
.homecols{display:flex;gap:20px;align-items:flex-start}.homecols .hl{flex:1 1 0;min-width:0;max-width:none}.homecols .hl .pg{max-width:none;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.cpcol{width:560px;flex:none;position:sticky;top:12px;max-height:calc(100vh - 110px);overflow:auto}
.cpp{background:var(--card,#111827);border:1px solid #2a3350;border-radius:14px;padding:16px 18px}.cpp.dirty{border-color:#ffb020}
.cph{display:flex;align-items:center;gap:10px}.cph h2{margin:0;font-size:20px;flex:1;display:flex;align-items:center;gap:8px}.badge.c{color:#8fb4ff;background:#10204a;opacity:1}

</style></head><body>
<div id="top"><img class="logo" src="build/icon.png" alt="Acura Comigo"><div><h1>ACURA COMIGO</h1><small>Organizador de Checkpoint Semanal</small></div><div class="sp"></div><span id="dirty"></span><button class="ic" id="cfg" title="Configurações">⚙</button></div>
<div id="app">
 <aside id="side">
  <input id="q" placeholder="Buscar produto, artigo ou chat…">
  <div class="sh">Produtos <button class="ic" id="na" title="Novo produto">+</button></div>
  <div id="list"></div>
  <div id="impbox"><div class="sh"><span><svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg>Arquivos importados</span><span id="impcount">0</span></div><input id="iqs" class="mini" placeholder="Pesquisar arquivos importados…"><div id="implist"></div></div>
  <div class="nav"><button id="nv-new" data-go="home">Início — Checkpoint</button><button id="nv-all" data-go="all">Todos os registros</button><button id="nv-fav" data-go="fav">Favoritos</button><button id="nv-exp" data-go="xexport"><svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Exportar dados</button><button id="nv-imp" data-go="ximport"><svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>Importar dados</button></div>
 </aside>
 <main id="main"></main>
</div>
<dialog id="dlg"><h3 id="dt" style="margin-top:0"></h3><label id="dnl">Nome</label><input class="f" id="dn"><div id="uw"><label>Link de referência (opcional)</label><input class="f" id="du" placeholder="https://…"></div><div class="bt"><button class="btn g2" id="dc">Cancelar</button><button class="btn" id="dsave">Salvar</button></div></dialog>
<dialog id="cdlg"><h3 style="margin-top:0">Configurações</h3><p style="color:var(--mut)">Seus dados ficam salvos neste computador:</p><p id="cp" style="word-break:break-all"></p><div class="bt"><button class="btn g2" id="co">Abrir pasta</button><button class="btn" id="cx">Fechar</button></div></dialog>
<dialog id="cf"><h3 style="margin-top:0">Confirmar</h3><p id="cfm" style="color:var(--mut)"></p><div class="bt"><button class="btn g2" id="cfn">Cancelar</button><button class="btn" id="cfo" style="background:var(--bad)">Excluir</button></div></dialog>

<input type="file" id="fi" accept="image/*" multiple hidden>
<input type="file" id="impfi" accept=".acura" hidden>

<div id="lb"><img></div><div id="toast"></div>
<script>
const {ipcRenderer,shell}=require('electron'),fs=require('fs'),path=require('path'),{pathToFileURL}=require('url');
const dir=ipcRenderer.sendSync('path'),imgDir=path.join(dir,'images'),file=path.join(dir,'data.json');
fs.mkdirSync(imgDir,{recursive:true});
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>!u?'':/^https?:\/\//i.test(u)?u:'https://'+u;
const clone=o=>JSON.parse(JSON.stringify(o));
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')};
const today=()=>new Date().toLocaleDateString('sv'),fmt=s=>s?s.split('-').reverse().join('/'):'';
const weekStart=s=>addD(s,-((new Date(s+'T12:00:00').getDay()+1)%7)); // semana sábado→sexta
let db=(()=>{for(const f of [file,file+'.bak']){try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){}}return{articles:[],records:[]}})();

 else if(act==='cp-new')guard(()=>{cps.sel='new';cps.d=null;cps.edit=true;cps.just=false;renderMain()});
 else if(act==='cp-open'){const id=b.dataset.id;if(cps.d&&cps.d.id===id&&!cps.edit)return;guard(()=>{cps.sel=id;cps.d=null;cps.edit=false;cps.just=false;renderMain()})}
 else if(act==='cp-print'){const r=await ipcRenderer.invoke('print-html',{html:core.cpPrintHtml(cpCur())});if(r&&!r.ok)toast('Não foi possível imprimir: '+r.error)}
 else if(act==='cp-export')guard(()=>{xs.kind='cp';xs.cmode='cp-current';xres=null;view={t:'export'};render()});
 else if(act==='cp-del'){const c=cpSaved(cps.d.id);if(!c)return;
  if(!await ask(`Excluir o checkpoint “${c.title}” (reunião de ${fmt(c.meetingDate)})? Esta ação não pode ser desfeita.`))return;
  const bk=clone(db.checkpoints);db.checkpoints=db.checkpoints.filter(x=>x.id!==c.id);if(!flush()){db.checkpoints=bk;return}
  cps={sel:null,edit:true,d:null,q:cps.q,just:false};render();toast('Checkpoint excluído')}});

// ================= Exportar / importar / biblioteca: checkpoints =================
function xSel(){if(xs.kind==='cp'){const cur=cpSaved(cps.sel);return{mode:xs.cmode,from:xs.from,to:xs.to,cpIds:xs.cmode==='cp-current'?(cur?[cur.id]:[]):[...xs.cids],author:xs.author.trim(),withImages:false}}
 return{mode:xs.mode,from:xs.from,to:xs.to,articleIds:[...xs.ids],author:xs.author.trim(),withImages:xs.imgs}}
function xSummary(){let d;try{d=core.select(db,xSel())}catch(e){return{ok:false,html:`<span class="mut">${esc(e.message)}</span>`}}
 const s=core.stats(d);
 if(xs.kind==='cp'){if(!s.checkpoints)return{ok:false,html:'<span class="mut">Nenhum checkpoint encontrado com essa seleção.</span>'};
  return{ok:true,html:`<div class="stats"><div><b>${s.checkpoints}</b>checkpoints</div></div><span class="mut">Período coberto: <b style="color:var(--tx)">${perio(s.min,s.max)}</b></span>`}}
 if(!s.articles)return{ok:false,html:'<span class="mut">Nenhum dado encontrado com essa seleção.</span>'};
 return{ok:true,html:`<div class="stats"><div><b>${s.products}</b>produtos</div><div><b>${s.articles}</b>artigos</div><div><b>${s.records}</b>conversas</div><div><b>${s.notes}</b>anotações</div><div><b>${s.images}</b>imagens</div></div><span class="mut">Período dos dados: <b style="color:var(--tx)">${perio(s.min,s.max)}</b></span>`}}
function exportHtml(){const dirty=dirtyIds().length+dirtyNotes().length,cp=xs.kind==='cp';
 const kopt=(k,t,d)=>`<label class="opt ${xs.kind===k?'on':''}"><input type="radio" name="xk" value="${k}" ${xs.kind===k?'checked':''}><b>${t}</b><small>${d}</small></label>`;
 const opt=(m,t,d)=>`<label class="opt ${xs.mode===m?'on':''}"><input type="radio" name="xm" value="${m}" ${xs.mode===m?'checked':''}><b>${t}</b><small>${d}</small></label>`;
 const copt=(m,t,d)=>`<label class="opt ${xs.cmode===m?'on':''}"><input type="radio" name="xcm" value="${m}" ${xs.cmode===m?'checked':''}><b>${t}</b><small>${d}</small></label>`;
 const dates=`<div class="xr"><div><label>De</label><input class="f" type="date" id="xf" value="${esc(xs.from)}"></div><div><label>Até</label><input class="f" type="date" id="xt" value="${esc(xs.to)}"></div></div>`;
 let opts,pan;
 if(cp){const cur=cpSaved(cps.sel),l=[...db.checkpoints].sort((a,b)=>b.meetingDate.localeCompare(a.meetingDate));
  opts=`<div class="opts c4">${copt('cp-current','Somente o atual','O checkpoint aberto na tela inicial')}${copt('cp-selected','Selecionados','Escolha as reuniões')}${copt('cp-all','Todos','Todos os checkpoints salvos')}${copt('cp-range','Por intervalo','Pela data da reunião')}</div>`;
  pan=xs.cmode==='cp-current'?(cur?`<b>${esc(cur.title)}</b><div class="mut">Reunião ${fmt(cur.meetingDate)} · período ${perio(cur.start,cur.end)}</div>`:'<span class="mut">O checkpoint atual ainda não foi salvo. Salve-o na tela inicial para exportá-lo.</span>')
   :xs.cmode==='cp-selected'?`<div class="acts2" style="margin:0 0 8px"><button class="btn g2" data-act="x-call">Marcar todos</button><button class="btn g2" data-act="x-cnone">Limpar seleção</button></div>${l.map(c=>`<label class="tl"><input type="checkbox" data-xc="${esc(c.id)}" ${xs.cids.has(c.id)?'checked':''}><b>${esc(c.title)}</b><small>${fmt(c.meetingDate)} · ${perio(c.start,c.end)}</small></label>`).join('')||'<p class="mut">Nenhum checkpoint salvo.</p>'}`
   :xs.cmode==='cp-range'?dates:'<span class="mut">Todos os checkpoints salvos serão exportados.</span>'}
 else{opts=`<div class="opts">${opt('from','A · A partir de uma data','Conversas com data igual ou posterior')}${opt('articles','B · Artigos específicos','Escolha um ou vários artigos')}${opt('period','C · Por período','Conversas e anotações entre duas datas')}</div>`;
  pan=xs.mode==='from'?`<label>Data inicial (data da conversa)</label><input class="f" type="date" id="xf" value="${esc(xs.from)}">`:xs.mode==='period'?dates
   :`<div class="acts2" style="margin:0 0 8px"><button class="btn g2" data-act="x-all" data-t="x">Marcar todos</button><button class="btn g2" data-act="x-none" data-t="x">Limpar seleção</button></div>${tree('exp',db.articles,xs.ids)}`}
 const r=xres?`<div class="res ${xres.ok?'ok':'bad'}">${xres.ok?'✓ ':'✕ '}${xres.msg}${xres.path?`<small>${esc(xres.path)}</small><button class="btn g2" data-act="x-show" data-u="${esc(xres.path)}">Mostrar na pasta</button>`:''}</div>`:'';
 return `<div class="head"><div><h2>${ico('up')}Exportar dados</h2><p>Gere um arquivo .acura para compartilhar seus checkpoints com o time</p></div></div><div class="xw">${r}
 ${dirty?'<div class="warn">⚠ Você tem alterações não salvas. Apenas o que já foi salvo é exportado.</div>':''}
 <div class="opts c2">${kopt('rec','Registros e artigos','Conversas, anotações e imagens')}${kopt('cp','Checkpoints semanais','Anotações das reuniões')}</div>
 ${opts}<div class="xpan">${pan}</div><div class="sumbox"><b>O que será exportado</b><div id="xsum" style="margin-top:8px"></div></div>
 <label>Seu nome (identifica a origem do arquivo — opcional)</label><input class="f" id="xau" maxlength="80" value="${esc(xs.author)}" placeholder="Ex.: Ana Souza" style="max-width:360px">
 ${cp?'':`<label class="chk"><input type="checkbox" id="xi" ${xs.imgs?'checked':''}> Incluir imagens no relatório PDF</label>`}
 <div class="acts2"><button class="btn" data-act="x-exp">${ico('up')}Exportar arquivo .acura</button><button class="btn g2" data-act="x-pdf">${ico('doc')}Gerar relatório PDF</button></div>
 <p class="mut xsm">O arquivo .acura é o pacote completo que o colega importa no Acura Comigo. O PDF é só para leitura, compartilhamento e impressão.</p></div>`}
main.addEventListener('change',e=>{const t=e.target;
 if(t.name==='xk'){xs.kind=t.value;xres=null;renderMain()}
 else if(t.name==='xcm'){xs.cmode=t.value;xres=null;renderMain()}
 else if(t.dataset.xc!==undefined){t.checked?xs.cids.add(t.dataset.xc):xs.cids.delete(t.dataset.xc);xRefresh()}
 else if(t.dataset.ic!==undefined){t.checked?xp.cids.add(t.dataset.ic):xp.cids.delete(t.dataset.ic);xiRefresh()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act^="x-"]');if(!b)return;const a=b.dataset.act;
 if(a==='x-call'||a==='x-cnone'){xs.cids.clear();if(a==='x-call')db.checkpoints.forEach(c=>xs.cids.add(c.id));document.querySelectorAll('[data-xc]').forEach(c=>{c.checked=xs.cids.has(c.dataset.xc)});xRefresh()}
 else if(a==='x-icall'||a==='x-icnone'){xp.cids.clear();if(a==='x-icall')xp.pkg.data.checkpoints.forEach(c=>xp.cids.add(c.id));document.querySelectorAll('[data-ic]').forEach(c=>{c.checked=xp.cids.has(c.dataset.ic)});xiRefresh()}});
function xiF(){return{from:xp.from,to:xp.to,articleIds:[...xp.ids],cpIds:[...xp.cids]}}
function xiSummary(){const d=core.filterData(xp.pkg.data,xiF()),s=core.stats(d),rel=core.related(db,d),nr=Object.keys(rel.articles).length;
 return{ok:!!(d.records.length||d.notes.length||d.articles.length||d.checkpoints.length),html:`<div class="stats"><div><b>${s.products}</b>produtos</div><div><b>${s.articles}</b>artigos</div><div><b>${s.records}</b>chats</div><div><b>${s.notes}</b>anotações</div><div><b>${s.images}</b>imagens</div>${xp.pkg.data.checkpoints.length?`<div><b>${s.checkpoints}</b>checkpoints</div>`:''}</div>
 <p style="margin:6px 0">Período dos registros: <b>${perio(s.min,s.max)}</b></p><p class="mut" style="margin:6px 0">Produtos: ${d.products.length?esc(d.products.map(p=>p.name).join(', ')):'—'}</p><p class="mut" style="margin:6px 0">Artigos: ${d.articles.length?esc(d.articles.map(a=>a.name).join(', ')):'—'}</p>
 ${nr?`<p style="margin:8px 0 0;color:#ffcf6a">≈ ${plural(nr,'artigo tem','artigos têm')} identificador ou nome igual a artigos seus. Eles serão mantidos em separado, sem alterar nem substituir os seus.</p>`:''}
 ${rel.checkpoints&&d.checkpoints.length?`<p style="margin:8px 0 0;color:#ffcf6a">≈ Há checkpoints com o mesmo identificador ou a mesma data de reunião que os seus. Nada será substituído: os recebidos ficam separados.</p>`:''}
 ${d.records.length||d.notes.length||d.articles.length||d.checkpoints.length?'':'<p style="color:#ff9a9a">Nada para importar com esses filtros.</p>'}`}}
function importHtml(){const head=`<div class="head"><div><h2>${ico('down')}Importar dados</h2><p>Receba um arquivo .acura de um colega — o conteúdo fica separado dos seus dados</p></div></div>`;
 if(!xp)return head+dzHtml();
 if(xp.err)return head+`<div class="res bad">✕ ${esc(xp.err)}${xp.fileName?`<small>${esc(xp.fileName)}</small>`:''}</div>`+dzHtml();
 const p=xp.pkg,all=core.stats(p.data),cl=p.data.checkpoints;
 let h=head+`<div class="sumbox"><b>${ico('doc')}${esc(xp.fileName)}</b><p class="mut" style="margin:6px 0 0">✓ Arquivo válido e íntegro · exportado ${p.author?`por <b style="color:var(--tx)">${esc(p.author)}</b> `:''}em ${when(p.createdAt)}<br>${cl.length?plural(cl.length,'checkpoint','checkpoints')+', ':''}${plural(all.records,'conversa','conversas')}, ${plural(all.notes,'anotação','anotações')}, ${plural(p.totalImages,'imagem','imagens')} · período do arquivo: ${perio(all.min,all.max)}</p></div>`;
 h+=xp.msgErr?`<div class="res bad">✕ ${esc(xp.msgErr)}</div>`:'';h+=p.warnings.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('');
 if(xp.dup)h+=`<div class="warn">⚠ ${xp.dup.kind==='file'?'Este arquivo já foi importado':'Um arquivo com exatamente o mesmo conteúdo já foi importado'} em ${when(xp.dup.entry.importedAt)} (“${esc(xp.dup.entry.name)}”). Você pode cancelar ou importar de novo — será criada uma entrada separada, sem alterar a anterior.</div>`;
 if(xp.rel.records)h+=`<div class="warn">≈ ${plural(xp.rel.records,'conversa tem','conversas têm')} o mesmo identificador de registros seus. Nada será substituído: o conteúdo importado fica sempre separado.</div>`;
 h+=`<div class="flt" style="max-width:880px"><b>Filtro de importação</b><label>De</label><input type="date" id="xif" value="${esc(xp.from)}"><label>Até</label><input type="date" id="xit" value="${esc(xp.to)}"><button class="ic" data-act="x-iperiod">Usar período do arquivo</button><button class="ic" data-act="x-iclr">Limpar</button><span class="g"></span><small class="mut">Em branco = todo o período</small></div>`;
 if(p.data.articles.length)h+=`<div class="xpan" style="max-width:880px"><div class="acts2" style="margin:0 0 8px"><b style="align-self:center;margin-right:auto">Artigos do pacote</b><button class="btn g2" data-act="x-all" data-t="i">Marcar todos</button><button class="btn g2" data-act="x-none" data-t="i">Limpar seleção</button></div>${tree('imp',p.data.articles,xp.ids,xp.rel.articles)}</div>`;
 if(cl.length)h+=`<div class="xpan" style="max-width:880px"><div class="acts2" style="margin:0 0 8px"><b style="align-self:center;margin-right:auto">Checkpoints do pacote</b><button class="btn g2" data-act="x-icall">Marcar todos</button><button class="btn g2" data-act="x-icnone">Limpar seleção</button></div>${[...cl].sort((a,b)=>b.meetingDate.localeCompare(a.meetingDate)).map(c=>`<div class="icp"><label class="tl"><input type="checkbox" data-ic="${esc(c.id)}" ${xp.cids.has(c.id)?'checked':''}><b>${esc(c.title)}</b><small>Reunião ${fmt(c.meetingDate)} · ${perio(c.start,c.end)}</small></label><details><summary>Prévia das anotações</summary><div class="pvw">${esc(c.text.slice(0,600))||'<i>Sem anotações</i>'}${c.text.length>600?'…':''}</div></details></div>`).join('')}</div>`;
 h+=`<div class="sumbox" style="max-width:880px"><b>Pré-visualização da importação</b><div id="xisum" style="margin-top:8px"></div></div>
 <div class="acts2"><button class="btn" data-act="x-confirm">Confirmar importação</button><button class="btn g2" data-act="x-cancel">Cancelar</button></div>`;
 return h}
function impBody(e){const q=iv.q.trim().toLowerCase(),lo=iv.from,hi=iv.to,rel=core.related(db,e).articles;
 const mr=r=>(!lo||r.date>=lo)&&(!hi||r.date<=hi),mn=n=>(!lo||n.end>=lo)&&(!hi||n.start<=hi);let out='';
 const cl=(e.checkpoints||[]).filter(c=>!iv.art&&(!lo||c.meetingDate>=lo)&&(!hi||c.meetingDate<=hi)&&(!q||(c.title+' '+c.text).toLowerCase().includes(q))).sort((a,b)=>b.meetingDate.localeCompare(a.meetingDate));
 if(cl.length)out+=`<h3 class="ph">Checkpoints Semanais <span class="tag">Importado</span></h3>`+cl.map(c=>`<section class="iart"><div class="iah"><b>${esc(c.title)}</b><span class="mut">Reunião ${fmt(c.meetingDate)} · período ${perio(c.start,c.end)}</span></div><div class="inote"><div class="ro">${esc(c.text)||'<i class="mut">Sem anotações</i>'}</div></div></section>`).join('');
 for(const p of e.products){let ph='';
  for(const a of e.articles.filter(x=>x.productId===p.id&&(!iv.art||x.id===iv.art))){const hit=q&&a.name.toLowerCase().includes(q);
   const recs=e.records.filter(r=>r.articleId===a.id&&mr(r)&&(!q||hit||(r.chat||'').toLowerCase().includes(q)||(r.notes||'').toLowerCase().includes(q))).sort((x,y)=>(y.date||'').localeCompare(x.date||''));
   const nts=e.notes.filter(n=>n.articleId===a.id&&mn(n)&&(!q||hit||n.text.toLowerCase().includes(q))).sort((x,y)=>y.start.localeCompare(x.start));
   if(!recs.length&&!nts.length&&(q||lo||hi))continue;ph+=impArt(e,a,recs,nts,rel[a.id])}
  if(ph)out+=`<h3 class="ph">${esc(p.name)} <span class="tag">Importado</span></h3>${ph}`}
 return out||'<div class="empty">Nada encontrado com esses filtros.</div>'}
function impHtml(){const e=db.imports.find(x=>x.id===view.id);if(!e)return'<div class="empty">Arquivo importado não encontrado.</div>';
 const imgs=e.imageCount,ncp=(e.checkpoints||[]).length;
 return `<div class="ibanner">${ico('box')}<b>Conteúdo importado de outro usuário</b> — somente leitura e separado dos seus dados.<small>Arquivo: ${esc(e.fileName)} · importado em ${when(e.importedAt)}${e.author?` · origem: ${esc(e.author)}`:''}${e.exportedAt?` · exportado em ${when(e.exportedAt)}`:''}${e.filter.from||e.filter.to?` · filtro usado: ${perio(e.filter.from,e.filter.to)}`:''}${e.filter.partialArticles?' · apenas artigos selecionados':''}${e.filter.partialCps?' · apenas checkpoints selecionados':''}</small></div>
 <div class="head"><div><h2>${esc(e.name)}</h2><p>${ncp?plural(ncp,'checkpoint','checkpoints')+' · ':''}${plural(e.products.length,'produto','produtos')} · ${plural(e.articles.length,'artigo','artigos')} · ${plural(e.records.length,'conversa','conversas')} · ${plural(e.notes.length,'anotação','anotações')} · ${plural(imgs,'imagem','imagens')}</p></div></div>
 <div class="flt" style="max-width:980px"><input id="ivq" placeholder="Pesquisar artigos, conversas e checkpoints…" value="${esc(iv.q)}" style="min-width:230px"><label>De</label><input type="date" id="ivf" value="${esc(iv.from)}"><label>Até</label><input type="date" id="ivt" value="${esc(iv.to)}">
 <select id="iva"><option value="">Todos os artigos</option>${e.articles.map(a=>`<option value="${esc(a.id)}" ${iv.art===a.id?'selected':''}>${esc((e.products.find(p=>p.id===a.productId)||{}).name||'')} › ${esc(a.name)}</option>`).join('')}</select>${iv.q||iv.from||iv.to||iv.art?'<button class="ic" data-act="x-ifclr">Limpar filtros</button>':''}</div><div id="ibody">${impBody(e)}</div>`}

function mainHtml(){const t=view.t;return t==='export'?exportHtml():t==='import'?importHtml():t==='imp'?impHtml():t==='prods'?homeHtml():t==='prod'?prodHtml():recsHtml()}
function afterMain(){if(view.t==='export')xRefresh();else if(view.t==='import')xiRefresh()}

// ---- eventos ----
$('#iqs').oninput=e=>{isq=e.target.value.trim();renderImps()};
$('#impfi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadPkg(f)};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ii'))e.target.click()});
main.addEventListener('input',e=>{const t=e.target;
 if(t.id==='xau')xs.author=t.value;
 else if(t.id==='ivq'){iv.q=t.value;$('#ibody').innerHTML=impBody(db.imports.find(x=>x.id===view.id))}});
main.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.name==='xm'){xs.mode=t.value;xres=null;renderMain()}
 else if(t.id==='xf'){xs.from=t.value;xRefresh()}else if(t.id==='xt'){xs.to=t.value;xRefresh()}
 else if(t.id==='xi')xs.imgs=t.checked;
 else if(d.xa!==undefined){t.checked?xs.ids.add(d.xa):xs.ids.delete(d.xa);syncTree('x');xRefresh()}
 else if(d.xp!==undefined){pArts(d.xp).forEach(a=>t.checked?xs.ids.add(a.id):xs.ids.delete(a.id));syncTree('x');xRefresh()}
 else if(t.id==='xif'){xp.from=t.value;xiRefresh()}else if(t.id==='xit'){xp.to=t.value;xiRefresh()}
 else if(d.ia!==undefined){t.checked?xp.ids.add(d.ia):xp.ids.delete(d.ia);syncTree('i');xiRefresh()}
 else if(d.ip!==undefined){xp.pkg.data.articles.filter(a=>a.productId===d.ip).forEach(a=>t.checked?xp.ids.add(a.id):xp.ids.delete(a.id));syncTree('i');xiRefresh()}
 else if(t.id==='ivf'||t.id==='ivt'||t.id==='iva'){iv[t.id==='ivf'?'from':t.id==='ivt'?'to':'art']=t.value;renderMain()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act^="x-"]');if(!b)return;e.preventDefault();const act=b.dataset.act;
 if(act==='x-pick')$('#impfi').click();
 else if(act==='x-exp')doExport('acura');
 else if(act==='x-pdf')doExport('pdf');
 else if(act==='x-show')shell.showItemInFolder(b.dataset.u);
 else if(act==='x-open'){const u=b.dataset.u;if(/^https?:\/\//i.test(u))shell.openExternal(u)}
 else if(act==='x-all'||act==='x-none'){const x=b.dataset.t==='x',ids=x?xs.ids:xp.ids,arts=x?db.articles:xp.pkg.data.articles;ids.clear();if(act==='x-all')arts.forEach(a=>ids.add(a.id));syncTree(b.dataset.t);x?xRefresh():xiRefresh()}
 else if(act==='x-iperiod'){const s=core.stats(xp.pkg.data);xp.from=s.min;xp.to=s.max;renderMain()}
 else if(act==='x-iclr'){xp.from=xp.to='';renderMain()}
 else if(act==='x-ifclr'){iv={q:'',from:'',to:'',art:''};renderMain()}
 else if(act==='x-confirm')confirmImport();
 else if(act==='x-cancel'){xp=null;renderMain()}
 else if(act==='x-delimp'){const en=db.imports.find(x=>x.id===b.dataset.id);if(!en)return;
  if(!await ask(`Excluir o arquivo importado “${en.name}”? O conteúdo e as imagens importados serão removidos deste computador. Seus próprios registros não são afetados.`))return;
  const i=db.imports.indexOf(en);db.imports.splice(i,1);if(!flush()){db.imports.splice(i,0,en);return}
  core.removeImportFiles(en.id,impRoot);if(view.t==='imp'&&view.id===en.id)view={t:'prods'};render();toast('Arquivo importado excluído')}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#dz');document.querySelectorAll('#dz.over').forEach(d=>d.classList.remove('over'));if(z)z.classList.add('over')});
document.addEventListener('drop',e=>{const fl=[...(e.dataTransfer&&e.dataTransfer.files||[])];document.querySelectorAll('#dz.over').forEach(d=>d.classList.remove('over'));
 if(view.t==='import'){if(fl[0])loadPkg(fl[0]);return}
 const f=fl.find(x=>/\.acura$/i.test(x.name));if(f)guard(()=>{view={t:'import'};xp=null;render();loadPkg(f)})});

render();
</script></body></html>
