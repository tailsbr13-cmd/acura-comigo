<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Acura Comigo</title>
<style>
:root{--bg:#262626;--card:#000;--field:#2f2f2f;--side:#151d33;--top:#16205a;--acc:#2f6bff;--tx:#f1f3f8;--mut:#9aa4bd;--ok:#2ecc71;--bad:#ff5c5c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#top{background:linear-gradient(90deg,#16205a,#1b2a6b);padding:14px 20px;display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:700;font-size:20px}
#top h1{font-size:19px;margin:0}#top small{color:#b7c4ff}
#top .sp{flex:1}.ic{padding:6px 10px;border-radius:8px;color:var(--mut)}.ic:hover{background:#ffffff18;color:#fff}
#app{flex:1;display:flex;min-height:0}
#side{width:270px;background:var(--side);display:flex;flex-direction:column;padding:14px;gap:8px}
#q{width:100%;background:#26324f;border:0;border-radius:10px;padding:11px 12px}
.sh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-top:8px;padding:0 4px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.it{text-align:left;padding:10px 12px;border-radius:10px;width:100%}
.it small{display:block;color:var(--mut);margin-top:2px}
.it:hover{background:#ffffff10}.it.on{background:#2c4a80}
.nav{border-top:1px solid #2c3858;padding-top:8px;display:flex;flex-direction:column}
.nav button{text-align:left;padding:8px 6px;border-radius:8px;color:#dfe5f7}.nav button:hover,.nav button.on{background:#ffffff12}
#main{flex:1;overflow:auto;padding:22px 26px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{margin:0;font-size:22px}.head p{margin:3px 0 0;color:var(--mut)}
.head .g{flex:1}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input,.tools select{background:var(--field);border:1px solid #444;border-radius:8px;padding:6px 8px;color-scheme:dark}
.btn{background:var(--acc);padding:7px 14px;border-radius:8px;font-weight:600}.btn.g2{background:#3a3a3a}
.card{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:14px;max-width:880px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ch .t{font-size:17px;font-weight:700;color:var(--tx)}a{color:#4d8dff;text-decoration:none}a:hover{text-decoration:underline}
.ch .sp{flex:1}.badge{font-size:12px;color:var(--ok);background:#0f2a18;padding:3px 10px;border-radius:99px;opacity:0;transition:opacity .3s}.badge.v{opacity:1}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
.f{width:100%;background:var(--field);border:1px solid transparent;border-radius:8px;padding:9px 10px;color-scheme:dark}
.f:focus{border-color:var(--acc);outline:0}textarea.f{min-height:80px;resize:vertical}
.drop{margin-top:12px;border:1px dashed #666;border-radius:10px;padding:12px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--acc);background:#2f6bff18}.drop button{color:#4d8dff}
.th{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-start}
.th div{position:relative}.th img{width:96px;height:72px;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.th .x{position:absolute;top:3px;right:3px;background:#000b;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:11px}.th .x:hover{background:var(--bad)}
.acts{display:flex;gap:4px;margin-top:10px;justify-content:flex-end}.acts button{padding:5px 10px;border-radius:8px;color:var(--mut)}.acts button:hover{background:#222;color:#fff}.acts .on{color:#ffc933}.acts .del:hover{color:var(--bad)}
.new{display:block;width:100%;max-width:880px;border:1px dashed #666;border-radius:12px;padding:22px;color:var(--mut)}.new:hover{border-color:var(--acc);color:#fff}
.empty{color:var(--mut);padding:40px 0;max-width:520px;line-height:1.6}
dialog{background:#1b2338;color:var(--tx);border:1px solid #3a4768;border-radius:14px;padding:20px;width:420px}
dialog::backdrop{background:#000a}dialog .f{background:#2a3454}dialog .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:92vw;max-height:92vh;border-radius:8px}
#toast{position:fixed;bottom:18px;right:18px;background:#1b2338;border:1px solid #3a4768;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none}#toast.v{opacity:1}
@media(max-width:1000px){.row{grid-template-columns:1fr}}
</style></head><body>
<div id="top"><div class="logo">A</div><div><h1>ACURA COMIGO</h1><small>Organizador de Checkpoint Semanal</small></div><div class="sp"></div><button class="ic" id="cfg" title="Configurações">⚙</button></div>
<div id="app">
 <aside id="side">
  <input id="q" placeholder="Buscar artigo ou chat…">
  <div class="sh">Meus artigos <button class="ic" id="na" title="Novo artigo">+</button></div>
  <div id="list"></div>
  <div class="nav"><button id="nv-new">+ Novo artigo</button><button id="nv-all">Todos os registros</button><button id="nv-fav">Favoritos</button></div>
 </aside>
 <main id="main"></main>
</div>
<dialog id="dlg"><h3 id="dt" style="margin-top:0"></h3><label>Nome do artigo</label><input class="f" id="dn"><label>Link de referência (opcional)</label><input class="f" id="du" placeholder="https://…"><div class="bt"><button class="btn g2" id="dc">Cancelar</button><button class="btn" id="ds">Salvar</button></div></dialog>
<dialog id="cdlg"><h3 style="margin-top:0">Configurações</h3><p style="color:var(--mut)">Seus dados ficam salvos neste computador:</p><p id="cp" style="word-break:break-all"></p><div class="bt"><button class="btn g2" id="co">Abrir pasta</button><button class="btn" id="cx">Fechar</button></div></dialog>
<input type="file" id="fi" accept="image/*" multiple hidden>
<div id="lb"><img></div><div id="toast"></div>
<script>
const {ipcRenderer,shell}=require('electron'),fs=require('fs'),path=require('path'),{pathToFileURL}=require('url');
const dir=ipcRenderer.sendSync('path'),imgDir=path.join(dir,'images'),file=path.join(dir,'data.json');
fs.mkdirSync(imgDir,{recursive:true});
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>!u?'':/^https?:\/\//i.test(u)?u:'https://'+u;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let db=(()=>{for(const f of [file,file+'.bak']){try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){}}return{articles:[],records:[]}})();
let view={t:'all'},q='',df='',sort='dnew',focusId=null,pend=null,editing=null,tmr;
if(db.articles.length)view={t:'a',id:db.articles[0].id};
// ---- salvamento (atômico + cópia .bak) ----
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('v');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('v'),1200)}
function save(){clearTimeout(tmr);tmr=setTimeout(flush,300)}
function flush(){clearTimeout(tmr);try{const tmp=file+'.tmp';fs.writeFileSync(tmp,JSON.stringify(db));if(fs.existsSync(file))fs.copyFileSync(file,file+'.bak');fs.renameSync(tmp,file);toast('Salvo')}catch(e){toast('Erro ao salvar: '+e.message)}}
window.addEventListener('beforeunload',flush);
// ---- dados ----
const art=id=>db.articles.find(a=>a.id===id),rec=id=>db.records.find(r=>r.id===id);
const count=id=>db.records.filter(r=>r.articleId===id).length;
const imgUrl=n=>pathToFileURL(path.join(imgDir,n)).href;
function addRecord(aid){const r={id:uid(),articleId:aid,chat:'',chatUrl:'',date:today(),notes:'',artUrl:'',images:[],fav:false,created:Date.now()};db.records.push(r);save();render();setTimeout(()=>document.querySelector(`[data-id="${r.id}"] [data-f="chat"]`)?.focus(),30)}
async function addImages(id,files){const r=rec(id);if(!r)return;let n=0;
 for(const f of files){if(!f.type.startsWith('image/'))continue;const ext=(f.type.split('/')[1]||'png').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'');const name=uid()+'.'+ext;fs.writeFileSync(path.join(imgDir,name),Buffer.from(await f.arrayBuffer()));r.images.push(name);n++}
 if(n){save();render();toast(n+' imagem(ns) anexada(s)')}}
// ---- render ----
function visible(){let l=db.records.filter(r=>view.t==='a'?r.articleId===view.id:view.t==='fav'?r.fav:true);
 if(q){const k=q.toLowerCase();l=l.filter(r=>(r.chat||'').toLowerCase().includes(k)||(art(r.articleId)?.name||'').toLowerCase().includes(k))}
 if(df)l=l.filter(r=>r.date===df);
 const d=(a,b)=>(a.date||'').localeCompare(b.date||'')||a.created-b.created;
 return l.sort(sort==='dnew'?(a,b)=>d(b,a):sort==='dold'?d:(a,b)=>b.created-a.created)}
function renderSide(){const k=q.toLowerCase();
 const l=db.articles.filter(a=>!k||a.name.toLowerCase().includes(k)||db.records.some(r=>r.articleId===a.id&&(r.chat||'').toLowerCase().includes(k)));
 $('#list').innerHTML=l.map(a=>`<button class="it ${view.t==='a'&&view.id===a.id?'on':''}" data-a="${a.id}"><b>${esc(a.name)}</b><small>${count(a.id)} registro${count(a.id)==1?'':'s'}</small></button>`).join('')||'<div class="empty" style="padding:10px">Nenhum artigo encontrado.</div>';
 $('#nv-all').classList.toggle('on',view.t==='all');$('#nv-fav').classList.toggle('on',view.t==='fav')}
function cardHtml(r){const a=art(r.articleId)||{name:'(artigo removido)'},al=url(r.artUrl||a.url),cl=url(r.chatUrl);
 return `<div class="card" data-id="${r.id}"><div class="ch">
 <span class="t">${al?`<a href="${esc(al)}" target="_blank">${esc(a.name)}</a>`:esc(a.name)}</span>
 <span>${cl?`<a href="${esc(cl)}" target="_blank">Chat #${esc(r.chat||'—')} ↗</a>`:`Chat #${esc(r.chat||'—')}`}</span><span class="sp"></span></div>
 <div class="row"><div><label>Número do chat</label><input class="f" data-f="chat" value="${esc(r.chat)}" placeholder="123456"></div>
 <div><label>Link do chat</label><input class="f" data-f="chatUrl" value="${esc(r.chatUrl)}" placeholder="https://…"></div>
 <div><label>Data da conversa</label><input class="f" type="date" data-f="date" value="${esc(r.date)}"></div></div>
 <label>Observações</label><textarea class="f" data-f="notes" placeholder="Escreva aqui suas observações sobre o artigo e a conversa…">${esc(r.notes)}</textarea>
 <label>Link específico do artigo (opcional — por padrão usa o do artigo)</label><input class="f" data-f="artUrl" value="${esc(r.artUrl)}" placeholder="${esc(a.url||'https://…')}">
 <div class="drop"><div>Arraste imagens aqui, cole com Ctrl + V ou <button data-act="pick">selecione arquivos</button></div>
 <div class="th">${r.images.map(n=>`<div><img src="${imgUrl(n)}" data-act="zoom" data-n="${n}"><button class="x" data-act="rmimg" data-n="${n}" title="Remover">✕</button></div>`).join('')}</div></div>
 <div class="acts"><button data-act="fav" class="${r.fav?'on':''}">${r.fav?'★ Favorito':'☆ Favoritar'}</button><button data-act="dup">Duplicar</button><button data-act="del" class="del">Excluir</button></div></div>`}
function renderMain(){const m=$('#main'),sc=m.scrollTop,l=visible(),a=view.t==='a'?art(view.id):null;
 const title=a?a.name:view.t==='fav'?'Favoritos':'Todos os registros';
 let h=`<div class="head"><div><h2>${esc(title)}</h2><p>${l.length} conversa${l.length==1?'':'s'} registrada${l.length==1?'':'s'}</p></div><div class="g"></div><div class="tools">
 <input type="date" id="df" value="${esc(df)}" title="Filtrar por data">${df?'<button class="ic" id="dx">limpar</button>':''}
 <select id="so"><option value="dnew">Data: mais recente</option><option value="dold">Data: mais antiga</option><option value="cnew">Criados por último</option></select>
 ${a?'<button class="btn g2" data-act="ea">Editar artigo</button><button class="btn g2" data-act="da">Excluir artigo</button>':''}</div></div>`;
 if(!db.articles.length)h+='<div class="empty"><b>Comece criando um artigo.</b><br>Cada artigo reúne todas as conversas sobre ele, sem duplicar temas.<br><br><button class="btn" data-act="na">Criar primeiro artigo</button></div>';
 else{h+=l.map(cardHtml).join('');
  if(!l.length)h+=`<div class="empty">Nada por aqui${q||df?' com esses filtros':' ainda'}.</div>`;
  if(a)h+='<button class="new" data-act="nr">＋ Novo registro</button>'}
 m.innerHTML=h;$('#so').value=sort;m.scrollTop=sc}
const render=()=>{renderSide();renderMain()};
// ---- eventos ----
$('#main').addEventListener('input',e=>{const c=e.target.closest('.card'),f=e.target.dataset.f;if(!c||!f)return;rec(c.dataset.id)[f]=e.target.value;save();
 if(f==='chat'||f==='chatUrl'||f==='artUrl')clearTimeout(render.h),render.h=setTimeout(()=>{if(document.activeElement===e.target)return;},0)});
$('#main').addEventListener('change',e=>{if(e.target.id==='df'){df=e.target.value;renderMain();return}if(e.target.id==='so'){sort=e.target.value;renderMain();return}
 if(e.target.dataset.f)render()}); // atualiza links/contagens ao sair do campo
$('#main').addEventListener('focusin',e=>{const c=e.target.closest('.card');if(c)focusId=c.dataset.id});
$('#main').addEventListener('focusout',e=>{if(e.target.dataset?.f==='chat'||e.target.dataset?.f==='chatUrl'||e.target.dataset?.f==='artUrl')setTimeout(()=>{if(!document.activeElement.closest?.('.card'))render()},50)});
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-act],#dx');if(!b)return;const c=b.closest('.card'),r=c&&rec(c.dataset.id),act=b.dataset.act||'dx';
 if(act==='dx'){df='';renderMain()}
 else if(act==='nr')addRecord(view.id);
 else if(act==='na')openDlg(null);
 else if(act==='ea')openDlg(view.id);
 else if(act==='da'){const a=art(view.id);if(confirm(`Excluir o artigo "${a.name}" e seus ${count(a.id)} registros?`)){db.records.filter(r=>r.articleId===a.id).forEach(rmFiles);db.records=db.records.filter(r=>r.articleId!==a.id);db.articles=db.articles.filter(x=>x!==a);view=db.articles[0]?{t:'a',id:db.articles[0].id}:{t:'all'};save();render()}}
 else if(act==='fav'){r.fav=!r.fav;save();render()}
 else if(act==='dup'){const n={...r,id:uid(),created:Date.now(),fav:false,images:r.images.map(i=>{const x=uid()+path.extname(i);fs.copyFileSync(path.join(imgDir,i),path.join(imgDir,x));return x})};db.records.push(n);save();render();toast('Registro duplicado')}
 else if(act==='del'){if(confirm('Excluir este registro e suas imagens?')){rmFiles(r);db.records=db.records.filter(x=>x!==r);save();render()}}
 else if(act==='pick'){pend=r.id;$('#fi').click()}
 else if(act==='zoom'){$('#lb img').src=imgUrl(b.dataset.n);$('#lb').classList.add('on')}
 else if(act==='rmimg'){r.images=r.images.filter(n=>n!==b.dataset.n);try{fs.unlinkSync(path.join(imgDir,b.dataset.n))}catch(e){}save();render()}});
function rmFiles(r){r.images.forEach(n=>{try{fs.unlinkSync(path.join(imgDir,n))}catch(e){}})}
$('#fi').onchange=e=>{addImages(pend,[...e.target.files]);e.target.value=''};
$('#lb').onclick=()=>$('#lb').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
document.addEventListener('paste',e=>{const fs_=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(!fs_.length)return;e.preventDefault();
 if(focusId&&rec(focusId))addImages(focusId,fs_);else toast('Clique em um card antes de colar a imagem')});
document.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.drop.over').forEach(d=>d.classList.remove('over'));e.target.closest?.('.card')?.querySelector('.drop')?.classList.add('over')});
document.addEventListener('drop',e=>{e.preventDefault();document.querySelectorAll('.drop.over').forEach(d=>d.classList.remove('over'));const c=e.target.closest?.('.card');if(c)addImages(c.dataset.id,[...e.dataTransfer.files])});
$('#list').onclick=e=>{const b=e.target.closest('[data-a]');if(b){view={t:'a',id:b.dataset.a};render()}};
$('#nv-all').onclick=()=>{view={t:'all'};render()};$('#nv-fav').onclick=()=>{view={t:'fav'};render()};
$('#q').oninput=e=>{q=e.target.value.trim();render()};
function openDlg(id){editing=id;const a=id&&art(id);$('#dt').textContent=a?'Editar artigo':'Novo artigo';$('#dn').value=a?a.name:'';$('#du').value=a?a.url||'':'';$('#dlg').showModal();$('#dn').focus()}
$('#na').onclick=$('#nv-new').onclick=()=>openDlg(null);
$('#dc').onclick=()=>$('#dlg').close();
$('#ds').onclick=()=>{const n=$('#dn').value.trim();if(!n){$('#dn').focus();return}
 if(editing){const a=art(editing);a.name=n;a.url=$('#du').value.trim()}else{const a={id:uid(),name:n,url:$('#du').value.trim()};db.articles.push(a);view={t:'a',id:a.id}}
 save();$('#dlg').close();render()};
$('#dlg').addEventListener('keydown',e=>{if(e.key==='Enter')$('#ds').click()});
$('#cfg').onclick=()=>{$('#cp').textContent=dir;$('#cdlg').showModal()};$('#cx').onclick=()=>$('#cdlg').close();$('#co').onclick=()=>shell.openPath(dir);
render();
</script></body></html>
