<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Acura Comigo</title>
<style>
:root{--bg:#262626;--card:#000;--field:#2f2f2f;--side:#151d33;--top:#16205a;--acc:#2f6bff;--tx:#f1f3f8;--mut:#9aa4bd;--ok:#2ecc71;--bad:#ff5c5c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#top{background:linear-gradient(90deg,#16205a,#1b2a6b);padding:14px 20px;display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:700;font-size:20px}
#top h1{font-size:19px;margin:0}#top small{color:#b7c4ff}
#top .sp{flex:1}.ic{padding:6px 10px;border-radius:8px;color:var(--mut)}.ic:hover{background:#ffffff18;color:#fff}
#app{flex:1;display:flex;min-height:0}
#side{width:270px;background:var(--side);display:flex;flex-direction:column;padding:14px;gap:8px}
#q{width:100%;background:#26324f;border:0;border-radius:10px;padding:11px 12px}
.sh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-top:8px;padding:0 4px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.it{text-align:left;padding:10px 12px;border-radius:10px;width:100%}
.it small{display:block;color:var(--mut);margin-top:2px}
.it:hover{background:#ffffff10}.it.on{background:#2c4a80}
.nav{border-top:1px solid #2c3858;padding-top:8px;display:flex;flex-direction:column}
.nav button{text-align:left;padding:8px 6px;border-radius:8px;color:#dfe5f7}.nav button:hover,.nav button.on{background:#ffffff12}
#main{flex:1;overflow:auto;padding:22px 26px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{margin:0;font-size:22px}.head p{margin:3px 0 0;color:var(--mut)}
.head .g{flex:1}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input,.tools select{background:var(--field);border:1px solid #444;border-radius:8px;padding:6px 8px;color-scheme:dark}
.btn{background:var(--acc);padding:7px 14px;border-radius:8px;font-weight:600}.btn.g2{background:#3a3a3a}
.card{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:14px;max-width:880px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ch .t{font-size:17px;font-weight:700;color:var(--tx)}a{color:#4d8dff;text-decoration:none}a:hover{text-decoration:underline}
.ch .sp{flex:1}.badge{font-size:12px;color:var(--ok);background:#0f2a18;padding:3px 10px;border-radius:99px;opacity:0;transition:opacity .3s}.badge.v{opacity:1}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
.f{width:100%;background:var(--field);border:1px solid transparent;border-radius:8px;padding:9px 10px;color-scheme:dark}
.f:focus{border-color:var(--acc);outline:0}textarea.f{min-height:80px;resize:vertical}
.drop{margin-top:12px;border:1px dashed #666;border-radius:10px;padding:12px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--acc);background:#2f6bff18}.drop button{color:#4d8dff}
.th{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-start}
.th div{position:relative}.th img{width:96px;height:72px;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.th .x{position:absolute;top:3px;right:3px;background:#000b;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:11px}.th .x:hover{background:var(--bad)}
.acts{display:flex;gap:4px;margin-top:10px;justify-content:flex-end}.acts button{padding:5px 10px;border-radius:8px;color:var(--mut)}.acts button:hover{background:#222;color:#fff}.acts .on{color:#ffc933}.acts .del:hover{color:var(--bad)}
.new{display:block;width:100%;max-width:880px;border:1px dashed #666;border-radius:12px;padding:22px;color:var(--mut)}.new:hover{border-color:var(--acc);color:#fff}
.empty{color:var(--mut);padding:40px 0;max-width:520px;line-height:1.6}
dialog{background:#1b2338;color:var(--tx);border:1px solid #3a4768;border-radius:14px;padding:20px;width:420px}
dialog::backdrop{background:#000a}dialog .f{background:#2a3454}dialog .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:92vw;max-height:92vh;border-radius:8px}
#toast{position:fixed;bottom:18px;right:18px;background:#1b2338;border:1px solid #3a4768;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none}#toast.v{opacity:1}
@media(max-width:1000px){.row{grid-template-columns:1fr}}
.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge.u{color:#ffb020;background:#2e2410;opacity:1}
.acts .sv{color:#fff;margin-right:auto;padding:7px 16px}.acts .sv:hover{background:#4a7cff;color:#fff}
.card:not(.dirty) [data-act=disc]{display:none}.card.dirty{outline:1px solid #ffb02066}
#dirty{color:#ffb020;font-size:13px;display:none}
#dirty.on{display:block}
.it.sub{margin-left:14px;width:calc(100% - 14px);font-size:13px;padding:7px 10px;border-left:2px solid #2c4a80;border-radius:0 8px 8px 0}
.bc{color:var(--mut);margin-bottom:10px;font-size:13px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:980px}
.pc{position:relative;text-align:left;background:#000;border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.pc:hover{outline:1px solid var(--acc)}.pc small{color:var(--mut)}.pc .pa{position:absolute;top:8px;right:8px;display:flex}
.pc .pa button{padding:2px 8px;color:var(--mut);border-radius:6px}.pc .pa button:hover{background:#222;color:#fff}
.pc.new2{border:1px dashed #666;background:none;justify-content:center;align-items:center;color:var(--mut)}
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#1d1d1d;border-radius:10px;padding:10px 12px;margin-bottom:14px;max-width:880px}
.flt label{display:inline;margin:0}.flt input,.flt select{background:var(--field);border:1px solid #444;border-radius:8px;padding:5px 8px;color-scheme:dark}.flt .g{flex:1}
.flt .btn{padding:5px 10px}
.notes{max-width:880px;background:#0e1b2e;border:1px solid #1f3a63;border-left:4px solid #3fa7ff;border-radius:12px;padding:16px 18px;margin-bottom:18px}
.notes h3{margin:0 0 10px;font-size:16px;color:#8cc8ff}.notes.dirty{border-color:#ffb02099}.ntop{display:flex;align-items:center;gap:10px;margin-bottom:6px}.ntop .sp{flex:1}
.notes textarea.f{min-height:130px;background:#16283f}.mut{color:var(--mut)}
.pn{margin-top:12px;display:flex;flex-direction:column;gap:4px}.pn small{color:var(--mut)}
.pn button{text-align:left;padding:6px 10px;border-radius:8px;background:#16283f}.pn button:hover{background:#1d3558}.pn span{color:var(--mut);margin-left:8px}
.sec{margin:6px 0 10px;font-size:15px;color:var(--mut)}
.card.sm{cursor:pointer}.card.sm:hover{outline:1px solid #3a4768}.pv{color:var(--mut);margin-top:4px}.card.sm .acts{margin-top:6px}
</style></head><body>
<div id="top"><div class="logo">A</div><div><h1>ACURA COMIGO</h1><small>Organizador de Checkpoint Semanal</small></div><div class="sp"></div><span id="dirty"></span><button class="ic" id="cfg" title="Configurações">⚙</button></div>
<div id="app">
 <aside id="side">
  <input id="q" placeholder="Buscar produto, artigo ou chat…">
  <div class="sh">Produtos <button class="ic" id="na" title="Novo produto">+</button></div>
  <div id="list"></div>
  <div class="nav"><button id="nv-new" data-go="home">Início — Produtos</button><button id="nv-all" data-go="all">Todos os registros</button><button id="nv-fav" data-go="fav">Favoritos</button></div>
 </aside>
 <main id="main"></main>
</div>
<dialog id="dlg"><h3 id="dt" style="margin-top:0"></h3><label id="dnl">Nome</label><input class="f" id="dn"><div id="uw"><label>Link de referência (opcional)</label><input class="f" id="du" placeholder="https://…"></div><div class="bt"><button class="btn g2" id="dc">Cancelar</button><button class="btn" id="dsave">Salvar</button></div></dialog>
<dialog id="cdlg"><h3 style="margin-top:0">Configurações</h3><p style="color:var(--mut)">Seus dados ficam salvos neste computador:</p><p id="cp" style="word-break:break-all"></p><div class="bt"><button class="btn g2" id="co">Abrir pasta</button><button class="btn" id="cx">Fechar</button></div></dialog>
<dialog id="cf"><h3 style="margin-top:0">Confirmar</h3><p id="cfm" style="color:var(--mut)"></p><div class="bt"><button class="btn g2" id="cfn">Cancelar</button><button class="btn" id="cfo" style="background:var(--bad)">Excluir</button></div></dialog>
<dialog id="gd"><h3 style="margin-top:0">Alterações não salvas</h3><p style="color:var(--mut)">Você tem registros com alterações que ainda não foram salvas. O que deseja fazer?</p><div class="bt"><button class="btn g2" id="gc">Cancelar</button><button class="btn g2" id="gx">Descartar</button><button class="btn" id="gs">Salvar</button></div></dialog>
<input type="file" id="fi" accept="image/*" multiple hidden>
<div id="lb"><img></div><div id="toast"></div>
<script>
const {ipcRenderer,shell}=require('electron'),fs=require('fs'),path=require('path'),{pathToFileURL}=require('url');
const dir=ipcRenderer.sendSync('path'),imgDir=path.join(dir,'images'),file=path.join(dir,'data.json');
fs.mkdirSync(imgDir,{recursive:true});
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>!u?'':/^https?:\/\//i.test(u)?u:'https://'+u;
const clone=o=>JSON.parse(JSON.stringify(o));
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')};
const today=()=>new Date().toLocaleDateString('sv'),fmt=s=>s?s.split('-').reverse().join('/'):'';
const weekStart=s=>addD(s,-((new Date(s+'T12:00:00').getDay()+1)%7)); // semana sábado→sexta
let db=(()=>{for(const f of [file,file+'.bak']){try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){}}return{articles:[],records:[]}})();
db.products=db.products||[];db.notes=db.notes||[];
if(db.articles.some(a=>!a.productId)){let p=db.products[0];if(!p){p={id:uid(),name:'Meus artigos'};db.products.push(p)}db.articles.forEach(a=>a.productId=a.productId||p.id);try{fs.writeFileSync(file,JSON.stringify(db))}catch(e){}}
let view={t:'prods'},sq='',aq='',ds='',de='',sort='dnew',focusId=null,pend=null,editing=null,work={},wn={},justSaved={},justN={},ex=new Set();
// ---- utilidades de UI ----
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('v');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('v'),1800)}
function ask(msg,ok='Excluir'){return new Promise(res=>{const d=$('#cf');$('#cfm').textContent=msg;$('#cfo').textContent=ok;$('#cfo').onclick=()=>{d.close();res(true)};$('#cfn').onclick=()=>{d.close();res(false)};d.oncancel=()=>res(false);d.showModal()})}
function flush(){try{const tmp=file+'.tmp';fs.writeFileSync(tmp,JSON.stringify(db));if(fs.existsSync(file))fs.copyFileSync(file,file+'.bak');fs.renameSync(tmp,file);return true}catch(e){toast('Erro ao salvar: '+e.message);return false}}
const delFile=n=>{try{fs.unlinkSync(path.join(imgDir,n))}catch(e){}};
// ---- consultas ----
const prod=id=>db.products.find(p=>p.id===id),art=id=>db.articles.find(a=>a.id===id),rec=id=>db.records.find(r=>r.id===id),cur=id=>work[id]||rec(id);
const pArts=pid=>db.articles.filter(a=>a.productId===pid),aCount=aid=>db.records.filter(r=>r.articleId===aid).length,pRecs=pid=>pArts(pid).reduce((n,a)=>n+aCount(a.id),0);
const imgUrl=n=>pathToFileURL(path.join(imgDir,n)).href;
const isDirty=id=>{const w=work[id];return !!w&&(!rec(id)||JSON.stringify(w)!==JSON.stringify(rec(id)))};
const noteSaved=k=>db.notes.find(n=>`${n.articleId}|${n.start}|${n.end}`===k),isND=k=>k in wn&&wn[k]!==(noteSaved(k)?.text||'');
const dirtyIds=()=>Object.keys(work).filter(isDirty),dirtyNotes=()=>Object.keys(wn).filter(isND);
const curNK=()=>view.t==='art'&&ds&&de&&ds<=de?`${view.id}|${ds}|${de}`:null;
// ---- rascunhos e salvamento manual ----
function edit(id,fn){ex.add(id);if(!work[id])work[id]=clone(rec(id));fn(work[id]);delete justSaved[id];if(rec(id)&&!isDirty(id))delete work[id];refresh()}
function saveRecord(id){const w=work[id];if(!w||!isDirty(id))return true;const old=rec(id),i=db.records.findIndex(r=>r.id===id),bk=clone(db.records);
 if(i>=0)db.records[i]=clone(w);else db.records.push(clone(w));
 if(!flush()){db.records=bk;return false}
 (old?old.images:[]).filter(n=>!w.images.includes(n)).forEach(delFile);delete work[id];justSaved[id]=true;return true}
function saveNote(k){if(!isND(k))return true;const [aid,s,e]=k.split('|'),bk=clone(db.notes),n=noteSaved(k);
 if(n){n.text=wn[k];n.updated=Date.now()}else db.notes.push({id:uid(),articleId:aid,start:s,end:e,text:wn[k],updated:Date.now()});
 if(!flush()){db.notes=bk;return false}delete wn[k];justN[k]=true;return true}
function discard(id){const w=work[id];if(!w)return;const keep=rec(id)?.images||[];w.images.filter(n=>!keep.includes(n)).forEach(delFile);delete work[id];delete justSaved[id]}
function guard(next,cancel){if(!dirtyIds().length&&!dirtyNotes().length)return next();const d=$('#gd');
 $('#gc').onclick=()=>{d.close();cancel&&cancel()};
 $('#gx').onclick=()=>{dirtyIds().forEach(discard);wn={};d.close();next()};
 $('#gs').onclick=()=>{if(dirtyIds().every(saveRecord)&&dirtyNotes().every(saveNote)){d.close();toast('Salvo com sucesso');next()}};
 d.showModal()}
ipcRenderer.on('req-close',()=>guard(()=>ipcRenderer.send('do-close')));
function delArt(aid){[...db.records,...Object.values(work)].filter(r=>r.articleId===aid).forEach(r=>{[rec(r.id),work[r.id]].forEach(x=>x&&x.images.forEach(delFile));delete work[r.id]});
 db.records=db.records.filter(r=>r.articleId!==aid);db.notes=db.notes.filter(n=>n.articleId!==aid);db.articles=db.articles.filter(a=>a.id!==aid);Object.keys(wn).filter(k=>k.startsWith(aid+'|')).forEach(k=>delete wn[k])}
function addRecord(aid){const n={id:uid(),articleId:aid,chat:'',chatUrl:'',date:today(),notes:'',images:[],fav:false,created:Date.now()};work[n.id]=n;ex.add(n.id);render();setTimeout(()=>document.querySelector(`[data-id="${n.id}"] [data-f="chat"]`)?.focus(),30)}
async function addImages(id,files){const names=[];
 for(const f of files){if(!f.type.startsWith('image/'))continue;const ext=(f.type.split('/')[1]||'png').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'');const name=uid()+'.'+ext;fs.writeFileSync(path.join(imgDir,name),Buffer.from(await f.arrayBuffer()));names.push(name)}
 if(names.length){edit(id,w=>w.images.push(...names));render();toast(names.length+' imagem(ns) adicionada(s) — clique em Salvar registro')}}
// ---- telas ----
function visible(){const ids=new Set(db.records.map(r=>r.id));
 let l=[...db.records.map(r=>cur(r.id)),...Object.values(work).filter(w=>!ids.has(w.id))].filter(r=>view.t==='art'?r.articleId===view.id:view.t==='fav'?r.fav:true);
 if(sq){const k=sq.toLowerCase();l=l.filter(r=>(r.chat||'').toLowerCase().includes(k)||(art(r.articleId)?.name||'').toLowerCase().includes(k))}
 l=l.filter(r=>(!ds||r.date>=ds)&&(!de||r.date<=de));
 const d=(a,b)=>(a.date||'').localeCompare(b.date||'')||a.created-b.created;
 return l.sort(sort==='dnew'?(a,b)=>d(b,a):sort==='dold'?d:(a,b)=>b.created-a.created)}
function renderSide(){const k=sq.toLowerCase(),cp=view.t==='prod'?view.id:view.t==='art'?art(view.id)?.productId:null;
 const am=a=>!k||a.name.toLowerCase().includes(k)||db.records.some(r=>r.articleId===a.id&&(r.chat||'').toLowerCase().includes(k));
 const l=db.products.filter(p=>!k||p.name.toLowerCase().includes(k)||pArts(p.id).some(am));
 $('#list').innerHTML=l.map(p=>`<button class="it ${view.t==='prod'&&view.id===p.id?'on':''}" data-go="p:${p.id}"><b>${esc(p.name)}</b><small>${pArts(p.id).length} artigo(s)</small></button>`+(p.id===cp?pArts(p.id).filter(am).map(a=>`<button class="it sub ${view.t==='art'&&view.id===a.id?'on':''}" data-go="a:${a.id}">${esc(a.name)}<small>${aCount(a.id)} registro(s)</small></button>`).join(''):'')).join('')||'<div class="empty" style="padding:10px">Nenhum produto.</div>';
 $('#nv-new').classList.toggle('on',view.t==='prods');$('#nv-all').classList.toggle('on',view.t==='all');$('#nv-fav').classList.toggle('on',view.t==='fav')}
const artBtns=a=>`<span class="pa"><button data-act="eaa" data-id="${a.id}" title="Editar">✎</button><button data-act="daa" data-id="${a.id}" title="Excluir">✕</button></span>`;
function prodsHtml(){return `<div class="head"><div><h2>Produtos</h2><p>${db.products.length} produto(s) — escolha um para ver seus artigos</p></div></div><div class="pg">${db.products.map(p=>`<div class="pc" data-go="p:${p.id}"><b>${esc(p.name)}</b><small>${pArts(p.id).length} artigo(s) · ${pRecs(p.id)} conversa(s)</small><span class="pa"><button data-act="ep" data-id="${p.id}" title="Editar">✎</button><button data-act="dp" data-id="${p.id}" title="Excluir">✕</button></span></div>`).join('')}<button class="pc new2" data-act="newp">＋ Novo produto</button></div>`}
function gridHtml(p){const k=aq.toLowerCase(),l=pArts(p.id).filter(a=>!k||a.name.toLowerCase().includes(k));
 return l.map(a=>`<div class="pc" data-go="a:${a.id}"><b>${esc(a.name)}</b><small>${aCount(a.id)} conversa(s)</small><small>${esc(a.url||'Sem link')}</small>${artBtns(a)}</div>`).join('')||'<div class="empty">Nenhum artigo encontrado.</div>'}
function prodHtml(){const p=prod(view.id);if(!p)return'';
 return `<div class="bc"><a href="#" data-go="home">Produtos</a> › ${esc(p.name)}</div><div class="head"><div><h2>${esc(p.name)}</h2><p>${pArts(p.id).length} artigo(s)</p></div><div class="g"></div><div class="tools"><input id="aq" placeholder="Pesquisar artigos…" value="${esc(aq)}"><button class="btn g2" data-act="ep" data-id="${p.id}">Editar produto</button><button class="btn g2" data-act="dp" data-id="${p.id}">Excluir produto</button><button class="btn" data-act="na">＋ Novo artigo</button></div></div><div class="pg" id="grid">${gridHtml(p)}</div>`}
function headHtml(r){const a=art(r.articleId),cl=url(r.chatUrl),n=`Chat #${esc(r.chat||'—')}`;
 return `<span class="t">${a?(a.url?`<a href="#" data-act="oa" title="Abrir link do artigo">${esc(a.name)}</a>`:esc(a.name)):'(artigo removido)'}</span><span>${cl?`<a href="#" data-act="oc">${n} ↗</a>`:n}</span>`}
function badge(id){return isDirty(id)?['u','● Alterações não salvas']:justSaved[id]?['v','Salvo ✓']:['','']}
function cardHtml(r){const [k,t]=badge(r.id);
 if(!ex.has(r.id)&&!isDirty(r.id))return `<div class="card sm" data-id="${r.id}" data-act="open"><div class="ch"><span class="hd">${headHtml(r)}</span><span class="sp"></span><span class="mut">${fmt(r.date)}</span></div><div class="pv">${esc((r.notes||'').slice(0,160))||'Sem observações'}${r.images.length?` · ${r.images.length} imagem(ns)`:''}</div><div class="acts"><button data-act="open">Editar</button><button data-act="fav" class="${r.fav?'on':''}">${r.fav?'★ Favorito':'☆ Favoritar'}</button><button data-act="dup">Duplicar</button><button data-act="del" class="del">Excluir</button></div></div>`;
 return `<div class="card ${isDirty(r.id)?'dirty':''}" data-id="${r.id}"><div class="ch"><span class="hd">${headHtml(r)}</span><span class="sp"></span><span class="badge ${k}">${t}</span></div>
 <div class="row"><div><label>Número do chat</label><input class="f" data-f="chat" value="${esc(r.chat)}" placeholder="123456"></div>
 <div><label>Link do chat</label><input class="f" data-f="chatUrl" value="${esc(r.chatUrl)}" placeholder="https://…"></div>
 <div><label>Data da conversa</label><input class="f" type="date" data-f="date" value="${esc(r.date)}"></div></div>
 <label>Observações</label><textarea class="f" data-f="notes" placeholder="Escreva aqui suas observações sobre o artigo e a conversa…">${esc(r.notes)}</textarea>
 <div class="drop"><div>Arraste imagens aqui, cole com Ctrl + V ou <button data-act="pick">selecione arquivos</button></div>
 <div class="th">${r.images.map(n=>`<div><img src="${imgUrl(n)}" data-act="zoom" data-n="${n}"><button class="x" data-act="rmimg" data-n="${n}" title="Remover">✕</button></div>`).join('')}</div></div>
 <div class="acts"><button class="btn sv" data-act="save">Salvar registro</button><button data-act="disc">Descartar alterações</button><button data-act="close">Recolher</button><button data-act="fav" class="${r.fav?'on':''}">${r.fav?'★ Favorito':'☆ Favoritar'}</button><button data-act="dup">Duplicar</button><button data-act="del" class="del">Excluir</button></div></div>`}
function notesHtml(a){const k=curNK();let b;
 if(k){const t=wn[k]??noteSaved(k)?.text??'';b=`<div class="ntop"><b>Período: ${fmt(ds)} a ${fmt(de)}</b><span class="sp"></span><span id="nb" class="badge"></span></div><textarea class="f" data-nk="${k}" placeholder="Principais pontos, acontecimentos e observações deste artigo no período…">${esc(t)}</textarea><div class="acts"><button class="btn sv" data-act="nsave">Salvar anotação</button><button data-act="ndisc" id="ndisc">Descartar alterações</button></div>`}
 else b='<p class="mut">Informe data inicial e final (ou use “Semana atual”) para ver e editar a anotação daquele período.</p>';
 const pv=db.notes.filter(n=>n.articleId===a.id&&n.text.trim()).sort((x,y)=>y.start.localeCompare(x.start));
 return `<section class="notes" id="nsec"><h3>Anotações do checkpoint</h3>${b}${pv.length?`<div class="pn"><small>Anotações já salvas deste artigo (clique para abrir o período)</small>${pv.map(n=>`<button data-act="np" data-s="${n.start}" data-e="${n.end}">${fmt(n.start)} a ${fmt(n.end)}<span>${esc(n.text.slice(0,70))}</span></button>`).join('')}</div>`:''}</section>`}
function recsHtml(){const l=visible(),a=view.t==='art'?art(view.id):null,p=a&&prod(a.productId);
 let h=a?`<div class="bc"><a href="#" data-go="home">Produtos</a> › <a href="#" data-go="p:${p?.id}">${esc(p?.name||'')}</a> › ${esc(a.name)}</div>`:'';
 h+=`<div class="head"><div><h2>${esc(a?a.name:view.t==='fav'?'Favoritos':'Todos os registros')}</h2><p>${a?(a.url?`<a href="#" data-act="oa2">${esc(a.url)} ↗</a>`:'Sem link de referência'):`${l.length} conversa(s)`}</p></div><div class="g"></div>${a?'<div class="tools"><button class="btn g2" data-act="ea">Editar artigo</button><button class="btn g2" data-act="da">Excluir artigo</button></div>':''}</div>
 <div class="flt"><b>Período</b><label>De</label><input type="date" id="ds" value="${ds}"><label>Até</label><input type="date" id="de" value="${de}"><button class="btn g2" data-act="wprev" title="Semana anterior">◀</button><button class="btn g2" data-act="wcur">Semana atual</button><button class="btn g2" data-act="wnext" title="Próxima semana">▶</button>${ds||de?'<button class="ic" id="dx">Limpar filtro</button>':''}<span class="g"></span><select id="so"><option value="dnew">Data: mais recente</option><option value="dold">Data: mais antiga</option><option value="cnew">Criados por último</option></select></div>`;
 if(a)h+=notesHtml(a);
 h+=`<h3 class="sec">Conversas (${l.length})${ds||de?' no período':''}</h3>`+l.map(cardHtml).join('');
 if(!l.length)h+=`<div class="empty">Nenhuma conversa${ds||de||sq?' com esses filtros':' ainda'}.</div>`;
 if(a)h+='<button class="new" data-act="nr">＋ Novo registro</button>';return h}
function renderMain(){const m=$('#main'),sc=m.scrollTop;m.innerHTML=!db.products.length&&view.t==='prods'?prodsHtml():view.t==='prods'?prodsHtml():view.t==='prod'?prodHtml():recsHtml();
 const so=$('#so');if(so)so.value=sort;m.scrollTop=sc;refresh()}
function refresh(){document.querySelectorAll('.card[data-id]:not(.sm)').forEach(c=>{const id=c.dataset.id,r=cur(id);if(!r)return;c.querySelector('.hd').innerHTML=headHtml(r);const b=c.querySelector('.badge'),[k,t]=badge(id);b.className='badge '+k;b.textContent=t;c.classList.toggle('dirty',isDirty(id));const f=c.querySelector('[data-act=fav]');f.textContent=r.fav?'★ Favorito':'☆ Favoritar';f.classList.toggle('on',r.fav)});
 const nk=curNK(),nb=$('#nb');if(nk&&nb){const [k,t]=isND(nk)?['u','● Anotação não salva']:justN[nk]?['v','Salvo ✓']:['',''];nb.className='badge '+k;nb.textContent=t;$('#nsec').classList.toggle('dirty',isND(nk));$('#ndisc').style.display=isND(nk)?'':'none'}
 const n=dirtyIds().length+dirtyNotes().length,d=$('#dirty');d.classList.toggle('on',n>0);d.textContent=`● ${n} item(ns) com alterações não salvas`}
function render(){renderSide();renderMain()}
const goStr=s=>s==='home'?{t:'prods'}:s==='all'?{t:'all'}:s==='fav'?{t:'fav'}:s[0]==='p'?{t:'prod',id:s.slice(2)}:{t:'art',id:s.slice(2)};
const go=v=>guard(()=>{view=v;ds=de='';aq='';render()});
const setPeriod=(s,e)=>guard(()=>{ds=s;de=e;renderMain()},()=>renderMain());
// ---- eventos ----
const main=$('#main');
main.addEventListener('input',e=>{const t=e.target,c=t.closest('.card');
 if(t.dataset.nk){const k=t.dataset.nk;wn[k]=t.value;delete justN[k];if(!isND(k))delete wn[k];refresh()}
 else if(t.id==='aq'){aq=t.value;$('#grid').innerHTML=gridHtml(prod(view.id))}
 else if(c&&t.dataset.f)edit(c.dataset.id,w=>w[t.dataset.f]=t.value)});
main.addEventListener('change',e=>{const t=e.target;if(t.id==='ds'||t.id==='de')setPeriod($('#ds').value,$('#de').value);else if(t.id==='so'){sort=t.value;renderMain()}});
main.addEventListener('focusin',e=>{const c=e.target.closest('.card');if(c)focusId=c.dataset.id});
function openDlg(k,id){editing={k,id};const o=k==='p'?prod(id):art(id);$('#dt').textContent=(o?'Editar ':'Novo ')+(k==='p'?'produto':'artigo');$('#dnl').textContent=k==='p'?'Nome do produto':'Nome do artigo';$('#uw').style.display=k==='p'?'none':'';$('#dn').value=o?o.name:'';$('#du').value=o?o.url||'':'';$('#dlg').showModal();$('#dn').focus()}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act],#dx,[data-go]');if(!b)return;
 if(b.tagName==='A')e.preventDefault();
 if(!b.dataset.act&&b.id!=='dx'){go(goStr(b.dataset.go));return}
 const c=b.closest('.card'),id=c?.dataset.id,r=id&&cur(id),act=b.dataset.act||'dx',did=b.dataset.id;
 if(act==='dx')setPeriod('','');
 else if(act==='wcur'){const s=weekStart(today());setPeriod(s,addD(s,6))}
 else if(act==='wprev'||act==='wnext'){const s=addD(ds||weekStart(today()),act==='wprev'?-7:7);setPeriod(s,addD(s,6))}
 else if(act==='np')setPeriod(b.dataset.s,b.dataset.e);
 else if(act==='nsave'){if(saveNote(curNK())){toast('Anotação salva com sucesso');renderMain()}}
 else if(act==='ndisc'){delete wn[curNK()];renderMain()}
 else if(act==='newp')openDlg('p',null);
 else if(act==='ep')openDlg('p',did);
 else if(act==='na')openDlg('a',null);
 else if(act==='ea')openDlg('a',view.id);
 else if(act==='eaa')openDlg('a',did);
 else if(act==='dp'){const p=prod(did),as=pArts(did);if(await ask(`Excluir o produto "${p.name}", seus ${as.length} artigo(s) e todas as conversas e anotações deles?`)){as.forEach(a=>delArt(a.id));db.products=db.products.filter(x=>x!==p);flush();if(view.id===did||as.some(a=>a.id===view.id))view={t:'prods'};render()}}
 else if(act==='da'||act==='daa'){const a=art(did||view.id);if(await ask(`Excluir o artigo "${a.name}", seus ${aCount(a.id)} registro(s) e anotações?`)){delArt(a.id);flush();if(view.id===a.id)view={t:'prod',id:a.productId};render()}}
 else if(act==='nr')addRecord(view.id);
 else if(act==='oa'){const u=art(r.articleId)?.url;if(u)shell.openExternal(url(u))}
 else if(act==='oa2'){const u=art(view.id)?.url;if(u)shell.openExternal(url(u))}
 else if(act==='oc'){if(r.chatUrl)shell.openExternal(url(r.chatUrl))}
 else if(act==='open'){ex.add(id);render()}
 else if(act==='close'){ex.delete(id);render()}
 else if(act==='save'){if(!isDirty(id))toast('Nenhuma alteração para salvar');else if(saveRecord(id)){toast('Registro salvo com sucesso');render()}}
 else if(act==='disc'){if(await ask('Descartar as alterações e voltar aos dados salvos?','Descartar')){discard(id);render()}}
 else if(act==='fav')edit(id,w=>w.fav=!w.fav),render();
 else if(act==='dup'){const n=clone(r);n.id=uid();n.created=Date.now();n.fav=false;n.images=r.images.map(i=>{const x=uid()+path.extname(i);fs.copyFileSync(path.join(imgDir,i),path.join(imgDir,x));return x});work[n.id]=n;ex.add(n.id);render();toast('Cópia criada — clique em Salvar registro')}
 else if(act==='del'){if(await ask('Excluir este registro e suas imagens?')){const s=rec(id);if(s){s.images.forEach(delFile);db.records=db.records.filter(x=>x.id!==id);flush()}discard(id);ex.delete(id);render()}}
 else if(act==='pick'){pend=id;$('#fi').click()}
 else if(act==='zoom'){$('#lb img').src=imgUrl(b.dataset.n);$('#lb').classList.add('on')}
 else if(act==='rmimg'){edit(id,w=>w.images=w.images.filter(n=>n!==b.dataset.n));render()}});
$('#fi').onchange=e=>{addImages(pend,[...e.target.files]);e.target.value=''};
$('#lb').onclick=()=>$('#lb').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on');
 if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();const nk=e.target.dataset?.nk;if(nk){if(saveNote(nk)){toast('Anotação salva com sucesso');renderMain()}}else if(focusId&&isDirty(focusId)&&saveRecord(focusId)){toast('Registro salvo com sucesso');render()}}});
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].filter(x=>x.type.startsWith('image/'));if(!f.length)return;e.preventDefault();
 if(focusId&&cur(focusId)&&ex.has(focusId))addImages(focusId,f);else toast('Abra um registro para edição antes de colar a imagem')});
document.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.drop.over').forEach(d=>d.classList.remove('over'));e.target.closest?.('.card')?.querySelector('.drop')?.classList.add('over')});
document.addEventListener('drop',e=>{e.preventDefault();document.querySelectorAll('.drop.over').forEach(d=>d.classList.remove('over'));const c=e.target.closest?.('.card');if(c&&ex.has(c.dataset.id))addImages(c.dataset.id,[...e.dataTransfer.files])});
$('#q').oninput=e=>{sq=e.target.value.trim();render()};
$('#na').onclick=()=>openDlg('p',null);
$('#dc').onclick=()=>$('#dlg').close();
$('#dsave').onclick=()=>{const n=$('#dn').value.trim(),u=$('#du').value.trim();if(!n){$('#dn').focus();return}const {k,id}=editing;
 if(k==='p'){if(id)prod(id).name=n;else db.products.push({id:uid(),name:n})}
 else if(id){const a=art(id);a.name=n;a.url=u}else db.articles.push({id:uid(),productId:view.id,name:n,url:u});
 if(flush()){$('#dlg').close();render();toast('Salvo com sucesso')}};
$('#dlg').addEventListener('keydown',e=>{if(e.key==='Enter')$('#dsave').click()});
$('#cfg').onclick=()=>{$('#cp').textContent=dir;$('#cdlg').showModal()};$('#cx').onclick=()=>$('#cdlg').close();$('#co').onclick=()=>shell.openPath(dir);
render();
</script></body></html>
